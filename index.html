<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Para Vanna</title>


<!-- GOOGLE FONT -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">


<!-- LUCIDE -->

<script src="https://unpkg.com/lucide@latest"></script>


<style>

/* =====================================
   VARIABLES
===================================== */

:root {

    --rosa: #f3a6c8;

    --rosa-claro: #ffd6e7;

    --rosa-fuerte: #ed79aa;

    --blanco: #fff8fc;

    --texto: #f8edf3;

    --texto-suave: #d8c5cf;

    --fondo-1: #080408;

    --fondo-2: #1b0b17;

}


/* =====================================
   RESET
===================================== */

* {

    box-sizing:
        border-box;

}


html,
body {

    width:
        100%;

    height:
        100%;

    margin:
        0;

}


body {

    min-height:
        100dvh;


    display:
        flex;


    align-items:
        center;


    justify-content:
        center;


    padding:
        14px;


    overflow:
        hidden;


    background:

        radial-gradient(
            circle at 15% 10%,
            rgba(163,38,102,0.28),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(115,32,85,0.22),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            var(--fondo-1),
            var(--fondo-2) 55%,
            #080408
        );


    color:
        white;


    font-family:
        "Fredoka",
        sans-serif;

}


/* =====================================
   PARTÍCULAS
===================================== */

.particulas {

    position:
        fixed;


    inset:
        0;


    pointer-events:
        none;


    overflow:
        hidden;


    z-index:
        0;

}


.particula {

    position:
        absolute;


    bottom:
        -20px;


    width:
        5px;


    height:
        5px;


    border-radius:
        50%;


    background:
        rgba(243,166,200,0.4);


    filter:
        blur(1px);


    animation:
        flotar
        linear
        infinite;

}


.particula:nth-child(1) {
    left: 8%;
    animation-duration: 11s;
}

.particula:nth-child(2) {
    left: 20%;
    animation-duration: 14s;
    animation-delay: 3s;
}

.particula:nth-child(3) {
    left: 35%;
    animation-duration: 10s;
    animation-delay: 2s;
}

.particula:nth-child(4) {
    left: 50%;
    animation-duration: 16s;
    animation-delay: 5s;
}

.particula:nth-child(5) {
    left: 65%;
    animation-duration: 12s;
    animation-delay: 1s;
}

.particula:nth-child(6) {
    left: 78%;
    animation-duration: 15s;
    animation-delay: 4s;
}

.particula:nth-child(7) {
    left: 90%;
    animation-duration: 13s;
    animation-delay: 2s;
}


/* =====================================
   CONTENEDOR
===================================== */

.contenedor {

    position:
        relative;


    z-index:
        2;


    width:
        min(92vw, 560px);


    height:
        auto;


    max-height:
        calc(100dvh - 28px);


    padding:
        34px 26px;


    display:
        flex;


    flex-direction:
        column;


    justify-content:
        center;


    align-items:
        center;


    text-align:
        center;


    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );


    border:
        1px solid
        rgba(255,255,255,0.13);


    border-radius:
        30px;


    backdrop-filter:
        blur(20px);


    box-shadow:

        0 30px 90px
        rgba(0,0,0,0.55),

        inset 0 1px 0
        rgba(255,255,255,0.06);


    animation:
        entradaTarjeta
        0.8s
        cubic-bezier(.22,1,.36,1);

}


/* =====================================
   ICONO PRINCIPAL
===================================== */

.icono-principal {

    width:
        70px;


    height:
        70px;


    flex-shrink:
        0;


    margin:
        0 auto 15px;


    display:
        flex;


    align-items:
        center;


    justify-content:
        center;


    border-radius:
        50%;


    background:

        radial-gradient(
            circle,
            rgba(243,166,200,0.16),
            rgba(243,166,200,0.04)
        );


    border:
        1px solid
        rgba(243,166,200,0.28);


    color:
        var(--rosa);


    box-shadow:
        0 0 40px
        rgba(243,166,200,0.12);

}


.icono-principal svg {

    width:
        34px;


    height:
        34px;


    stroke-width:
        1.5;


    animation:
        latido
        3s
        ease-in-out
        infinite;

}


/* =====================================
   TEXTO
===================================== */

.pequeno {

    font-size:
        11px;


    letter-spacing:
        3px;


    text-transform:
        uppercase;


    color:
        var(--rosa);


    font-weight:
        500;

}


h1 {

    margin:
        12px 0;


    font-size:
        clamp(30px, 8vw, 45px);


    line-height:
        1.1;


    font-weight:
        500;


    letter-spacing:
        -1px;

}


p {

    margin:
        10px 0;


    font-size:
        17px;


    line-height:
        1.45;


    color:
        var(--texto);


    font-weight:
        300;

}


strong {

    color:
        var(--rosa-claro);


    font-weight:
        500;

}


/* =====================================
   BOTÓN
===================================== */

.boton {

    margin-top:
        18px;


    display:
        inline-flex;


    align-items:
        center;


    justify-content:
        center;


    gap:
        9px;


    padding:
        13px 25px;


    border:
        1px solid
        rgba(243,166,200,0.28);


    border-radius:
        50px;


    color:
        white;


    background:
        rgba(243,166,200,0.10);


    font-family:
        "Fredoka",
        sans-serif;


    font-size:
        15px;


    font-weight:
        500;


    cursor:
        pointer;


    transition:
        0.25s ease;

}


.boton svg {

    width:
        18px;


    height:
        18px;

}


.boton:hover {

    transform:
        translateY(-3px);


    background:
        rgba(243,166,200,0.18);

}


/* =====================================
   OPCIONES
===================================== */

.opciones {

    width:
        100%;


    display:
        grid;


    grid-template-columns:
        repeat(2, 1fr);


    gap:
        9px;


    margin-top:
        18px;

}


.opcion {

    position:
        relative;


    height:
        88px;


    padding:
        10px;


    display:
        flex;


    flex-direction:
        column;


    align-items:
        center;


    justify-content:
        center;


    gap:
        7px;


    border:
        1px solid
        rgba(255,255,255,0.11);


    border-radius:
        18px;


    color:
        var(--texto);


    background:
        rgba(255,255,255,0.045);


    font-family:
        "Fredoka",
        sans-serif;


    font-size:
        13px;


    cursor:
        pointer;


    overflow:
        hidden;


    transition:
        transform
        0.25s ease,

        background
        0.25s ease,

        border
        0.25s ease;

}


.opcion svg {

    width:
        26px;


    height:
        26px;


    color:
        var(--rosa);


    stroke-width:
        1.5;


    transition:
        0.25s ease;

}


.opcion:hover {

    transform:
        translateY(-3px);


    background:
        rgba(243,166,200,0.09);


    border-color:
        rgba(243,166,200,0.28);

}


.opcion:hover svg {

    transform:
        scale(1.12);

}


/* =====================================
   RESPUESTA DENTRO DEL BOTÓN
===================================== */

.respuesta-opcion {

    position:
        absolute;


    inset:
        0;


    padding:
        8px;


    display:
        flex;


    flex-direction:
        column;


    align-items:
        center;


    justify-content:
        center;


    text-align:
        center;


    background:
        rgba(28,11,23,0.97);


    border-radius:
        inherit;


    opacity:
        0;


    transform:
        scale(0.85);


    pointer-events:
        none;


    transition:
        0.3s ease;

}


.respuesta-opcion.activa {

    opacity:
        1;


    transform:
        scale(1);

}


.respuesta-opcion svg {

    width:
        22px;


    height:
        22px;


    color:
        var(--rosa);


    margin-bottom:
        4px;

}


.respuesta-texto {

    font-size:
        12px;


    line-height:
        1.2;


    color:
        var(--texto);

}


/* =====================================
   GUANTERA CORRECTA
===================================== */

.opcion.correcta {

    border-color:
        rgba(243,166,200,0.55);


    background:
        rgba(243,166,200,0.10);


    box-shadow:
        0 0 30px
        rgba(243,166,200,0.12);

}


.opcion.correcta .respuesta-opcion {

    background:
        linear-gradient(
            145deg,
            rgba(90,35,65,0.98),
            rgba(29,10,22,0.98)
        );

}


.opcion.correcta .respuesta-opcion svg {

    color:
        var(--rosa-claro);

}


/* =====================================
   CELEBRACIÓN
===================================== */

.confeti {

    position:
        fixed;


    width:
        6px;


    height:
        6px;


    border-radius:
        50%;


    pointer-events:
        none;


    z-index:
        20;

}


/* =====================================
   ANIMACIONES
===================================== */

@keyframes entradaTarjeta {

    from {

        opacity:
            0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes latido {

    0%, 100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.07);

    }

}


@keyframes flotar {

    0% {

        transform:
            translateY(0);

        opacity:
            0;

    }

    10% {

        opacity:
            0.7;

    }

    100% {

        transform:
            translateY(-110vh);

        opacity:
            0;

    }

}


@keyframes sacudir {

    0%,
    100% {

        transform:
            translateX(0);

    }

    25% {

        transform:
            translateX(-5px);

    }

    50% {

        transform:
            translateX(5px);

    }

    75% {

        transform:
            translateX(-3px);

    }

}


@keyframes acertar {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.05);

    }

    100% {

        transform:
            scale(1);

    }

}


/* =====================================
   MÓVIL
===================================== */

@media (max-height: 700px) {

    .contenedor {

        padding:
            20px 18px;

    }


    .icono-principal {

        width:
            58px;

        height:
            58px;

        margin-bottom:
            10px;

    }


    .icono-principal svg {

        width:
            28px;

        height:
            28px;

    }


    h1 {

        font-size:
            28px;

        margin:
            8px 0;

    }


    p {

        font-size:
            15px;

        margin:
            7px 0;

    }


    .opciones {

        margin-top:
            12px;

        gap:
            7px;

    }


    .opcion {

        height:
            75px;

    }

}


@media (max-width: 380px) {

    .opcion {

        height:
            78px;

        font-size:
            12px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     PARTÍCULAS
===================================== -->

<div class="particulas">

    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>

</div>



<!-- =====================================
     CONTENEDOR
===================================== -->

<div
    class="contenedor"
    id="contenido">


    <div class="icono-principal">

        <i data-lucide="heart"></i>

    </div>


    <div class="pequeno">

        Para alguien especial

    </div>


    <h1>

        Vanna...

    </h1>


    <p>

        Hay cosas que simplemente
        no se pueden explicar con palabras.

    </p>


    <p>

        Pero creo que esta merece
        que sigas descubriéndola.

    </p>


    <button
        class="boton"
        onclick="mostrarBusqueda()">

        Continuar

        <i data-lucide="arrow-right"></i>

    </button>


</div>



<script>


/* =====================================
   ICONOS
===================================== */

lucide.createIcons();



/* =====================================
   MOSTRAR JUEGO
===================================== */

function mostrarBusqueda() {


    const contenido =
        document.getElementById("contenido");


    contenido.style.opacity =
        "0";


    contenido.style.transform =
        "scale(.97)";


    setTimeout(() => {


        contenido.innerHTML = `

            <div class="icono-principal">

                <i data-lucide="search"></i>

            </div>


            <div class="pequeno">

                Primera pista

            </div>


            <h1>

                Ahora comienza el juego...

            </h1>


            <p>

                Hay algo que dejé para ti
                dentro del auto.

            </p>


            <p>

                Pero no te voy a decir dónde.

                <br>

                Tendrás que descubrirlo.

            </p>


            <p>

                <strong>
                    ¿Dónde crees que está?
                </strong>

            </p>


            <div class="opciones">


                ${crearOpcion(
                    "door-open",
                    "Puerta del conductor",
                    "No está aquí."
                )}


                ${crearOpcion(
                    "armchair",
                    "Asiento del conductor",
                    "Sigue buscando."
                )}


                ${crearOpcion(
                    "user-round",
                    "Asiento del copiloto",
                    "Tampoco..."
                )}


                ${crearOpcion(
                    "users-round",
                    "Asiento trasero",
                    "No precisamente."
                )}


                ${crearOpcion(
                    "briefcase",
                    "Maletero",
                    "Demasiado lejos."
                )}


                ${crearOpcion(
                    "sun",
                    "Parasol",
                    "No está ahí."
                )}


                ${crearOpcion(
                    "sliders-horizontal",
                    "Consola central",
                    "Casi... pero no."
                )}


                ${crearOpcion(
                    "package",
                    "Guantera",
                    "correcta"
                )}

            </div>

        `;


        lucide.createIcons();


        contenido.style.opacity =
            "1";


        contenido.style.transform =
            "scale(1)";


    }, 300);

}



/* =====================================
   CREAR TARJETA
===================================== */

function crearOpcion(
    icono,
    nombre,
    respuesta
) {


    return `

        <button
            class="opcion"
            onclick="seleccionar(this, '${nombre}', '${respuesta}')">


            <div class="opcion-normal">

                <i data-lucide="${icono}"></i>

                <span>
                    ${nombre}
                </span>

            </div>


            <div class="respuesta-opcion">

                <i data-lucide="circle-x"></i>

                <span class="respuesta-texto">

                    ${respuesta}

                </span>

            </div>


        </button>

    `;

}



/* =====================================
   SELECCIONAR OPCIÓN
===================================== */

function seleccionar(
    boton,
    lugar,
    respuesta
) {


    /* ===============================
       GUANTERA
    =============================== */

    if (lugar === "Guantera") {


        boton.classList.add(
            "correcta"
        );


        boton.innerHTML = `

            <div class="respuesta-opcion activa">

                <i data-lucide="sparkles"></i>

                <span class="respuesta-texto">

                    ¡Acertaste! ✨

                    <br><br>

                    Ve a buscar lo que dejé
                    para ti aquí.

                </span>

            </div>

        `;


        lucide.createIcons();


        crearCelebracion();


        if (navigator.vibrate) {

            navigator.vibrate(
                [80,50,120]
            );

        }


        /*
           Después de un momento,
           mostramos el mensaje general.
        */

        setTimeout(() => {

            mostrarMensajeGuantera();

        }, 1300);


        return;

    }


    /* ===============================
       OPCIÓN INCORRECTA
    =============================== */

    const respuestaDiv =
        boton.querySelector(
            ".respuesta-opcion"
        );


    const texto =
        boton.querySelector(
            ".respuesta-texto"
        );


    const mensajes = {

        "Puerta del conductor":
            "Mmm... no está ahí.",

        "Asiento del conductor":
            "No está aquí.",

        "Asiento del copiloto":
            "Tampoco está ahí.",

        "Asiento trasero":
            "No precisamente...",

        "Maletero":
            "Demasiado lejos.",

        "Parasol":
            "No está ahí.",

        "Consola central":
            "Casi... pero no."

    };


    texto.innerHTML = `

        ${mensajes[lugar]}

        <br>

        <small>

            Sigue buscando...

        </small>

    `;


    respuestaDiv.classList.add(
        "activa"
    );


    boton.style.animation =
        "sacudir .45s ease";


    setTimeout(() => {

        boton.style.animation =
            "";

    }, 500);


    /*
       Después de 1.5 segundos
       vuelve a mostrar la opción.
    */

    setTimeout(() => {

        respuestaDiv.classList.remove(
            "activa"
        );

    }, 1600);

}



/* =====================================
   MENSAJE FINAL GUANTERA
===================================== */

function mostrarMensajeGuantera() {


    const contenido =
        document.getElementById("contenido");


    contenido.innerHTML = `

        <div class="icono-principal">

            <i data-lucide="sparkles"></i>

        </div>


        <div class="pequeno">

            ¡Pista encontrada!

        </div>


        <h1>

            ¡Muy bien!

        </h1>


        <p>

            Sabía que lo encontrarías.

        </p>


        <p>

            Ahora sí...

            <br>

            ve a buscar lo que dejé
            para ti en la <strong>guantera</strong>.

        </p>


        <p>

            Hay algo dulce esperándote.

        </p>


        <p>

            Y cuando lo encuentres,
            sabrás qué hacer después.

        </p>

    `;


    lucide.createIcons();


}



/* =====================================
   CELEBRACIÓN
===================================== */

function crearCelebracion() {


    for (
        let i = 0;
        i < 22;
        i++
    ) {


        const elemento =
            document.createElement("div");


        elemento.className =
            "confeti";


        elemento.style.left =
            "50%";


        elemento.style.top =
            "50%";


        elemento.style.background =
            "rgba(243,166,200,0.9)";


        document.body.appendChild(
            elemento
        );


        const angulo =
            Math.random() *
            Math.PI * 2;


        const distancia =
            80 +
            Math.random() * 180;


        const x =
            Math.cos(angulo) *
            distancia;


        const y =
            Math.sin(angulo) *
            distancia;


        elemento.animate(

            [

                {

                    transform:
                        "translate(-50%, -50%) scale(0)",

                    opacity:
                        1

                },

                {

                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        scale(1.2)`,

                    opacity:
                        0

                }

            ],

            {

                duration:
                    800 +
                    Math.random() * 700,

                easing:
                    "cubic-bezier(.22,1,.36,1)"

            }

        );


        setTimeout(() => {

            elemento.remove();

        }, 1600);

    }

}

</script>

</body>

</html>
