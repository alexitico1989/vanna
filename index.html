<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Para Vanna</title>


<!-- ================================
     GOOGLE FONT
================================ -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">


<!-- ================================
     LUCIDE ICONS
================================ -->

<script src="https://unpkg.com/lucide@latest"></script>


<style>

/* =====================================
   VARIABLES
===================================== */

:root {

    --rosa: #f3a6c8;

    --rosa-claro: #ffd6e7;

    --rosa-fuerte: #ed79aa;

    --blanco: #fff8fc;

    --texto: #f8edf3;

    --texto-suave: #d8c5cf;

    --fondo-1: #080408;

    --fondo-2: #1b0b17;

    --borde: rgba(255,255,255,0.13);

}


/* =====================================
   RESET
===================================== */

* {

    box-sizing: border-box;

}


html {

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    overflow-x: hidden;


    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(163, 38, 102, 0.28),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(115, 32, 85, 0.22),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            var(--fondo-1),
            var(--fondo-2) 55%,
            #080408
        );


    color: white;


    font-family:
        "Fredoka",
        sans-serif;

}


/* =====================================
   PARTÍCULAS DE FONDO
===================================== */

.particulas {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;

}


.particula {

    position: absolute;

    bottom: -20px;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background: rgba(243,166,200,0.45);

    filter: blur(1px);

    animation:
        flotar linear infinite;

}


.particula:nth-child(1) {
    left: 8%;
    animation-duration: 11s;
    animation-delay: 1s;
}


.particula:nth-child(2) {
    left: 20%;
    animation-duration: 14s;
    animation-delay: 4s;
}


.particula:nth-child(3) {
    left: 35%;
    animation-duration: 10s;
    animation-delay: 2s;
}


.particula:nth-child(4) {
    left: 50%;
    animation-duration: 16s;
    animation-delay: 6s;
}


.particula:nth-child(5) {
    left: 65%;
    animation-duration: 12s;
    animation-delay: 3s;
}


.particula:nth-child(6) {
    left: 78%;
    animation-duration: 15s;
    animation-delay: 1s;
}


.particula:nth-child(7) {
    left: 90%;
    animation-duration: 13s;
    animation-delay: 5s;
}


/* =====================================
   CONTENEDOR
===================================== */

.contenedor {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 560px;

    max-height: 90vh;

    overflow-y: auto;

    padding: 44px 30px;

    text-align: center;


    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );


    border:

        1px solid
        var(--borde);


    border-radius: 30px;


    backdrop-filter:
        blur(20px);


    box-shadow:

        0 30px 90px
        rgba(0,0,0,0.55),

        inset 0 1px 0
        rgba(255,255,255,0.06);


    animation:

        entradaTarjeta
        1s
        cubic-bezier(.22,1,.36,1);

}


/* =====================================
   ICONO PRINCIPAL
===================================== */

.icono-principal {

    width: 82px;

    height: 82px;

    margin:
        0 auto 22px;


    display: flex;

    align-items: center;

    justify-content: center;


    border-radius: 50%;


    background:

        radial-gradient(
            circle,
            rgba(243,166,200,0.16),
            rgba(243,166,200,0.04)
        );


    border:

        1px solid
        rgba(243,166,200,0.28);


    color:
        var(--rosa);


    box-shadow:

        0 0 45px
        rgba(243,166,200,0.12);


    animation:

        aparecerIcono
        1.2s
        ease;


}


.icono-principal svg {

    width: 39px;

    height: 39px;

    stroke-width: 1.5;

    animation:

        latidoIcono
        3s
        ease-in-out
        infinite;

}


/* =====================================
   TEXTOS
===================================== */

.pequeno {

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color:
        var(--rosa);


    opacity: 0;

    font-weight: 500;


    animation:

        aparecerTexto
        0.8s
        0.3s
        forwards;

}


h1 {

    margin:
        16px 0;


    font-size:
        clamp(34px, 8vw, 48px);


    line-height:
        1.1;


    font-weight:
        500;


    letter-spacing:
        -1px;


    animation:

        aparecerTexto
        0.8s
        0.45s
        both;

}


p {

    margin:
        14px 0;


    font-size:
        19px;


    line-height:
        1.65;


    color:
        var(--texto);


    font-weight:
        300;


    animation:

        aparecerTexto
        0.8s
        0.6s
        both;

}


strong {

    color:
        var(--rosa-claro);


    font-weight:
        500;

}


/* =====================================
   BOTÓN
===================================== */

.boton {

    margin-top:
        25px;


    display:
        inline-flex;


    align-items:
        center;


    justify-content:
        center;


    gap:
        10px;


    padding:
        15px 27px;


    border:
        1px solid
        rgba(243,166,200,0.28);


    border-radius:
        50px;


    color:
        white;


    background:

        linear-gradient(
            135deg,
            rgba(243,166,200,0.16),
            rgba(255,255,255,0.06)
        );


    font-family:
        "Fredoka",
        sans-serif;


    font-size:
        16px;


    font-weight:
        500;


    cursor:
        pointer;


    opacity:
        0;


    animation:

        aparecerBoton
        0.8s
        0.9s
        forwards;


    transition:

        transform
        0.25s
        ease,

        background
        0.25s
        ease,

        box-shadow
        0.25s
        ease;

}


.boton svg {

    width:
        19px;

    height:
        19px;

    transition:
        transform
        0.25s
        ease;

}


.boton:hover {

    transform:
        translateY(-4px)
        scale(1.03);


    background:
        rgba(243,166,200,0.20);


    box-shadow:

        0 12px 35px
        rgba(243,166,200,0.15);

}


.boton:hover svg {

    transform:
        translateX(4px);

}


.boton:active {

    transform:
        scale(0.96);

}


/* =====================================
   OPCIONES
===================================== */

.opciones {

    display:
        grid;


    grid-template-columns:
        repeat(2, 1fr);


    gap:
        12px;


    margin-top:
        28px;

}


.opcion {

    position:
        relative;


    min-height:
        105px;


    padding:
        18px 10px;


    display:
        flex;


    flex-direction:
        column;


    align-items:
        center;


    justify-content:
        center;


    gap:
        10px;


    border:
        1px solid
        rgba(255,255,255,0.11);


    border-radius:
        20px;


    color:
        var(--texto);


    background:
        rgba(255,255,255,0.045);


    font-family:
        "Fredoka",
        sans-serif;


    font-size:
        15px;


    font-weight:
        400;


    cursor:
        pointer;


    opacity:
        0;


    animation:

        aparecerOpcion
        0.6s
        forwards;


    transition:

        transform
        0.25s
        ease,

        background
        0.25s
        ease,

        border
        0.25s
        ease,

        box-shadow
        0.25s
        ease;

}


/* entrada escalonada */

.opcion:nth-child(1) {
    animation-delay: 0.05s;
}

.opcion:nth-child(2) {
    animation-delay: 0.10s;
}

.opcion:nth-child(3) {
    animation-delay: 0.15s;
}

.opcion:nth-child(4) {
    animation-delay: 0.20s;
}

.opcion:nth-child(5) {
    animation-delay: 0.25s;
}

.opcion:nth-child(6) {
    animation-delay: 0.30s;
}

.opcion:nth-child(7) {
    animation-delay: 0.35s;
}

.opcion:nth-child(8) {
    animation-delay: 0.40s;
}


.opcion svg {

    width:
        29px;

    height:
        29px;


    color:
        var(--rosa);


    stroke-width:
        1.5;


    transition:

        transform
        0.3s
        ease,

        filter
        0.3s
        ease;

}


.opcion:hover {

    transform:
        translateY(-5px);


    background:
        rgba(243,166,200,0.09);


    border-color:
        rgba(243,166,200,0.28);


    box-shadow:

        0 12px 35px
        rgba(0,0,0,0.25);

}


.opcion:hover svg {

    transform:
        scale(1.15)
        rotate(-4deg);


    filter:

        drop-shadow(
            0 0 8px
            rgba(243,166,200,0.35)
        );

}


.opcion:active {

    transform:
        scale(0.96);

}


/* =====================================
   MENSAJE
===================================== */

.mensaje {

    margin-top:
        25px;


    min-height:
        60px;

}


.mensaje p {

    animation:

        mensajeEntrada
        0.45s
        ease;

}


/* =====================================
   ERROR
===================================== */

.error {

    display:
        inline-flex;


    align-items:
        center;


    justify-content:
        center;


    width:
        48px;


    height:
        48px;


    margin-bottom:
        5px;


    border-radius:
        50%;


    color:
        #f3a6c8;


    background:
        rgba(243,166,200,0.08);


    border:
        1px solid
        rgba(243,166,200,0.18);


    animation:

        errorShake
        0.45s
        ease;

}


.error svg {

    width:
        23px;

    height:
        23px;

}


/* =====================================
   ACIERTO
===================================== */

.exito {

    animation:

        exitoEntrada
        0.8s
        cubic-bezier(.22,1,.36,1);

}


.exito .icono-principal {

    animation:

        exitoPulso
        1.8s
        ease-in-out
        infinite;

}


.exito .icono-principal svg {

    animation:
        ninguna;

}


/* =====================================
   ANIMACIONES
===================================== */

@keyframes entradaTarjeta {

    from {

        opacity:
            0;

        transform:

            translateY(35px)
            scale(0.96);

    }

    to {

        opacity:
            1;

        transform:

            translateY(0)
            scale(1);

    }

}


@keyframes aparecerIcono {

    from {

        opacity:
            0;

        transform:
            scale(0.6)
            rotate(-15deg);

    }

    to {

        opacity:
            1;

        transform:
            scale(1)
            rotate(0);

    }

}


@keyframes latidoIcono {

    0%, 100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.07);

    }

}


@keyframes aparecerTexto {

    from {

        opacity:
            0;

        transform:
            translateY(12px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


@keyframes aparecerBoton {

    from {

        opacity:
            0;

        transform:
            translateY(15px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


@keyframes aparecerOpcion {

    from {

        opacity:
            0;

        transform:
            translateY(15px)
            scale(0.96);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes mensajeEntrada {

    from {

        opacity:
            0;

        transform:
            translateY(12px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


@keyframes errorShake {

    0% {

        transform:
            translateX(0);

    }

    25% {

        transform:
            translateX(-5px);

    }

    50% {

        transform:
            translateX(5px);

    }

    75% {

        transform:
            translateX(-3px);

    }

    100% {

        transform:
            translateX(0);

    }

}


@keyframes exitoEntrada {

    from {

        opacity:
            0;

        transform:
            scale(0.85)
            translateY(20px);

    }

    to {

        opacity:
            1;

        transform:
            scale(1)
            translateY(0);

    }

}


@keyframes exitoPulso {

    0%, 100% {

        transform:
            scale(1);

        box-shadow:

            0 0 35px
            rgba(243,166,200,0.12);

    }

    50% {

        transform:
            scale(1.08);

        box-shadow:

            0 0 65px
            rgba(243,166,200,0.25);

    }

}


@keyframes flotar {

    0% {

        transform:
            translateY(0)
            translateX(0);

        opacity:
            0;

    }

    10% {

        opacity:
            0.7;

    }

    50% {

        transform:
            translateY(-50vh)
            translateX(25px);

    }

    100% {

        transform:
            translateY(-110vh)
            translateX(-20px);

        opacity:
            0;

    }

}


/* =====================================
   MÓVIL
===================================== */

@media (max-width: 480px) {

    body {

        padding:
            14px;

    }


    .contenedor {

        padding:
            35px 18px;

        border-radius:
            25px;

    }


    h1 {

        font-size:
            34px;

    }


    p {

        font-size:
            17px;

        line-height:
            1.6;

    }


    .opciones {

        grid-template-columns:
            1fr 1fr;

        gap:
            9px;

    }


    .opcion {

        min-height:
            100px;

        font-size:
            14px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     PARTÍCULAS
===================================== -->

<div class="particulas">

    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>
    <div class="particula"></div>

</div>



<!-- =====================================
     CONTENIDO
===================================== -->

<div class="contenedor" id="contenido">


    <div class="icono-principal">

        <i data-lucide="heart"></i>

    </div>


    <div class="pequeno">

        Para alguien especial

    </div>


    <h1>

        Vanna...

    </h1>


    <p>

        Hay cosas que simplemente
        no se pueden explicar
        con palabras.

    </p>


    <p>

        Pero creo que esta merece
        que sigas descubriéndola.

    </p>


    <button
        class="boton"
        onclick="mostrarBusqueda()">

        Continuar

        <i data-lucide="arrow-right"></i>

    </button>


</div>



<script>

/* =====================================
   ICONOS
===================================== */

lucide.createIcons();



/* =====================================
   MOSTRAR BÚSQUEDA
===================================== */

function mostrarBusqueda() {

    const contenido =
        document.getElementById("contenido");


    /*
       Pequeña transición antes
       de cambiar de pantalla.
    */

    contenido.style.opacity = "0";

    contenido.style.transform =
        "translateY(20px) scale(0.98)";


    setTimeout(() => {


        contenido.innerHTML = `

            <div class="icono-principal">

                <i data-lucide="search"></i>

            </div>


            <div class="pequeno">

                Primera pista

            </div>


            <h1>

                Ahora comienza el juego...

            </h1>


            <p>

                Hay algo que dejé para ti
                dentro del auto.

            </p>


            <p>

                Pero no te voy a decir dónde.

                <br>

                Tendrás que descubrirlo.

            </p>


            <p>

                <strong>
                    ¿Dónde crees que está?
                </strong>

            </p>


            <div class="opciones">


                <button
                    class="opcion"
                    onclick="buscar('Puerta del conductor')">

                    <i data-lucide="door-open"></i>

                    <span>
                        Puerta del conductor
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Asiento del conductor')">

                    <i data-lucide="armchair"></i>

                    <span>
                        Asiento del conductor
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Asiento del copiloto')">

                    <i data-lucide="user-round"></i>

                    <span>
                        Asiento del copiloto
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Asiento trasero')">

                    <i data-lucide="users-round"></i>

                    <span>
                        Asiento trasero
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Maletero')">

                    <i data-lucide="briefcase"></i>

                    <span>
                        Maletero
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Parasol')">

                    <i data-lucide="sun"></i>

                    <span>
                        Parasol
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Consola central')">

                    <i data-lucide="sliders-horizontal"></i>

                    <span>
                        Consola central
                    </span>

                </button>


                <button
                    class="opcion"
                    onclick="buscar('Guantera')">

                    <i data-lucide="package"></i>

                    <span>
                        Guantera
                    </span>

                </button>


            </div>


            <div
                class="mensaje"
                id="mensaje">

            </div>

        `;


        lucide.createIcons();


        /*
           Reactivar entrada.
        */

        requestAnimationFrame(() => {

            contenido.style.opacity = "1";

            contenido.style.transform =
                "translateY(0) scale(1)";

        });


    }, 350);

}



/* =====================================
   BUSCAR LUGAR
===================================== */

function buscar(lugar) {

    const mensaje =
        document.getElementById("mensaje");


    /* =================================
       RESPUESTA CORRECTA
    ================================= */

    if (lugar === "Guantera") {


        mensaje.innerHTML = `

            <div class="exito">


                <div class="icono-principal">

                    <i data-lucide="sparkles"></i>

                </div>


                <h1>

                    ¡Acertaste!

                </h1>


                <p>

                    Sabía que lo encontrarías.

                </p>


                <p>

                    Ahora ve a buscar
                    lo que dejé para ti
                    en la <strong>guantera</strong>.

                </p>


                <p>

                    Hay algo dulce
                    esperándote.

                </p>


                <p>

                    Y cuando lo encuentres,
                    sabrás qué hacer después.

                </p>


            </div>

        `;


        lucide.createIcons();


        /*
           Pequeña vibración si
           el dispositivo la soporta.
        */

        if (navigator.vibrate) {

            navigator.vibrate(
                [80, 50, 120]
            );

        }


        /*
           Celebración de partículas.
        */

        crearCelebracion();


        return;

    }


    /* =================================
       RESPUESTAS INCORRECTAS
    ================================= */

    const respuestas = {


        "Puerta del conductor":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                Mmm... no está ahí.
                <br><br>
                Sigue buscando.
            </p>
            `,


        "Asiento del conductor":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                No está ahí.
                <br><br>
                Intenta nuevamente.
            </p>
            `,


        "Asiento del copiloto":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                Tampoco está ahí.
                <br><br>
                Pero me gusta cómo estás buscando.
            </p>
            `,


        "Asiento trasero":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                No precisamente...
                <br><br>
                Sigue intentando.
            </p>
            `,


        "Maletero":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                Demasiado lejos.
                <br><br>
                Busca en otro lugar.
            </p>
            `,


        "Parasol":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                No está ahí.
                <br><br>
                Aún no lo encuentras.
            </p>
            `,


        "Consola central":

            `
            <div class="error">
                <i data-lucide="circle-x"></i>
            </div>

            <p>
                Casi...
                pero no.
                <br><br>
                Sigue buscando.
            </p>
            `

    };


    mensaje.innerHTML =
        respuestas[lugar];


    lucide.createIcons();

}



/* =====================================
   CELEBRACIÓN
===================================== */

function crearCelebracion() {

    for (
        let i = 0;
        i < 18;
        i++
    ) {


        const particula =
            document.createElement("div");


        particula.style.position =
            "fixed";


        particula.style.left =
            "50%";


        particula.style.top =
            "50%";


        particula.style.width =
            "6px";


        particula.style.height =
            "6px";


        particula.style.borderRadius =
            "50%";


        particula.style.background =
            "rgba(243,166,200,0.85)";


        particula.style.pointerEvents =
            "none";


        particula.style.zIndex =
            "10";


        document.body.appendChild(
            particula
        );


        const angulo =
            Math.random() * Math.PI * 2;


        const distancia =
            80 +
            Math.random() * 180;


        const x =
            Math.cos(angulo) *
            distancia;


        const y =
            Math.sin(angulo) *
            distancia;


        particula.animate(

            [

                {
                    transform:
                        "translate(-50%, -50%) scale(0)",

                    opacity:
                        1

                },

                {

                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        scale(1.2)`,

                    opacity:
                        0

                }

            ],

            {

                duration:
                    900 +
                    Math.random() * 700,

                easing:
                    "cubic-bezier(.22,1,.36,1)"

            }

        );


        setTimeout(() => {

            particula.remove();

        }, 1700);

    }

}
